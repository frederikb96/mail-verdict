# MailVerdict Infrastructure Configuration
#
# This file contains ONLY infrastructure settings (file-based, requires a
# restart to take effect). Application settings (AI, spam, rules, retry) --
# including provider API keys -- live in the database and are managed via
# the Settings API.
#
# Override: config-custom/config.override.yaml (sparse, only changed values)
# or MAIL_VERDICT_<SECTION>_<KEY> environment variables.

server:
  host: 0.0.0.0
  port: 8080
  # A plain background socket the liveness probe hits instead of the main
  # port -- it answers from its own thread, so it stays responsive even
  # when a handler blocks the asyncio event loop the rest of the app runs
  # on. Change the chart's matching container port alongside this.
  liveness_port: 8081
  # How long the readiness probe waits for the database before deciding the
  # answer is "busy" rather than "broken". A pod that is merely loaded stays
  # in the Service; one whose database is genuinely unreachable leaves it.
  readiness_timeout_seconds: 0.5
  log_level: INFO
  cors_origins: []            # same-origin serving by default; empty disables CORS

security:
  # AES-256-GCM key (64 hex characters / 32 bytes) encrypting provider API
  # keys stored via the Settings API. Empty disables storing a key that
  # way -- ANTHROPIC_API_KEY / OPENAI_API_KEY environment variables still
  # work as a fallback. Generate: python -c "import os; print(os.urandom(32).hex())"
  encryption_key: "${ENCRYPTION_KEY}"

# Limits on an outgoing message's attachments. Both are enforced while the
# upload is being read, because the cost being bounded is memory: every
# attachment is held whole to be handed to PostIMAP.
outbox:
  # Largest single attachment. Most providers reject well below this.
  max_attachment_bytes: 26214400
  # Largest total across one message, and the cap that actually protects the
  # process -- without it, many acceptable attachments still exhaust memory.
  max_attachments_total_bytes: 52428800
  # How many attachments one message may carry.
  max_attachments: 20
  # How long a message may wait on its way out before it is raised as an
  # alert rather than left waiting silently: an outbox row PostIMAP has not
  # finished with, or a send whose undo window passed without it moving on.
  # A healthy send takes seconds; this catches the one that stopped.
  stalled_alert_after_seconds: 600

mail_actions:
  # How long the idempotency key of a message action or bulk action is
  # remembered. A client retrying within this window is answered with the
  # first response instead of acting again; one retrying later is applied
  # afresh. A request carrying expected_folder_id(s) is still safe then: a
  # message no longer where the client saw it is left alone.
  submission_retention_hours: 168

# Native (iPhone) push. The app registers its device with a push relay, and
# this server sends each notification through that relay sealed with a key
# only the phone holds: the relay sees the device token, the caller's
# address and an encrypted blob, never a subject, a sender or an account.
# Needs security.encryption_key, which protects the stored relay tickets.
push:
  # Relays a native app may register this server against. An empty list
  # disables native push and stops every send to a relay.
  apns_relay_urls: ["https://mailverdict-push.frederikberg.net"]
  # Minimum gap between two silent "something was read" pushes to phones;
  # a change inside the gap is sent once at its end.
  read_sync_min_interval_seconds: 600
  # How long one request to a relay may take before it counts as failed.
  relay_timeout_seconds: 10

# Rule-triggered webhooks (webhooks/worker.py): a rule's "webhook" action
# queues one delivery per mail, and one worker sends them in order.
webhooks:
  # How long one request may take end to end. Some receivers do real work
  # inside the request (parsing an attachment, say), so this is generous.
  request_timeout_seconds: 60
  # Attempts per delivery before it is marked failed and raised as an alert.
  # Only a transient outcome (5xx, 408, 429, network error, timeout) is
  # retried; any other response ends the delivery at once.
  max_attempts: 6
  # Retry delay: full-jitter exponential from the base, capped.
  base_delay_seconds: 30
  max_delay_seconds: 1800
  # Largest raw message sent. A larger one fails at once instead of being
  # rejected by the receiver after a long upload.
  max_body_bytes: 26214400
  # Fallback poll when the queue's wake-up notification is missed.
  poll_interval_seconds: 2
  # How long a claimed delivery may sit unrenewed before it is reclaimed.
  # The worker renews it while a request is in flight, so this only
  # matters after a crash.
  lease_seconds: 120

database:
  url: "${MAIL_VERDICT_DATABASE_URL}"
  pool_size: 10
  max_overflow: 5
  # Connections held back from the combined running concurrency of every
  # queue (queue/manager.py) so an HTTP handler sharing this pool always
  # finds one free. A queue's own concurrency ceiling is
  # (pool_size + max_overflow - reserved_for_requests) minus whatever
  # every other running queue has already claimed.
  reserved_for_requests: 3

search:
  # Semantic search scans message_embeddings exactly rather than through
  # its approximate HNSW index (embeddings/search.py) -- an approximate
  # scan can silently return the wrong neighbourhood for a query far from
  # every document, where an exact one cannot. Cost is linear in embedded
  # message count, measured at roughly 18 microseconds per vector at 1536
  # dimensions: 14,000 embedded messages took 254ms, 50,000 would take
  # roughly 900ms, 200,000 roughly 3.6s. The embedding count is logged at
  # startup against this ceiling; above it, the exact scan should be
  # measured again rather than assumed to still be the right choice.
  exact_scan_row_ceiling: 200000

# The glacier: a per-account place a message can be moved to where it
# leaves the mail server for good and lives on only in this database
# (glacier/). Every write it makes to the mail server -- an EXPUNGE, an
# APPEND on restore -- goes through the same small, paced steps whether
# triggered by hand or by the automatic sweep below.
glacier:
  # The global kill switch for the automatic sweep. Manual glaciering
  # and restore are unaffected -- this only stops the periodic pass that
  # moves an account's own archive in on its own schedule.
  sweep_enabled: true
  # How often the sweep ticks, per process (one replica actually runs it
  # at a time, via an advisory lock).
  interval_seconds: 60
  # How many messages one tick may newly glacier, per account. Paced
  # deliberately low: each glaciered message becomes one queued IMAP
  # EXPUNGE in PostIMAP's outbound queue, ahead of every flag change and
  # send that account makes meanwhile -- a flood here would stall the
  # interactive app. At this rate a mailbox with thousands of archived
  # messages finishes in a few hours, not in one tick.
  batch_size: 25
  # The sweep's circuit breaker: an account with this many messages
  # already sitting unconfirmed in the "removing" state is skipped
  # entirely until some of them resolve, rather than piling on more.
  max_unconfirmed: 500
  # How long a message must have sat in "removing" with no matching
  # sync_notifications failure before its expunge counts as confirmed --
  # the contract offers no positive "this landed" signal, so the end is
  # detected by age instead of by enumerating every way it can fail.
  confirm_grace_seconds: 600
  # The largest manual move-into-the-glacier a single request may make.
  # The copy itself is cheap, but each message becomes one queued IMAP
  # EXPUNGE, so a large manual selection is refused in favour of turning
  # on the automatic sweep instead.
  max_manual_batch: 200
  # How long a restore (the APPEND syncing back as a live message) may
  # take before it is treated as failed, with an alert raised and the
  # glacier copy left intact for a retry.
  restore_timeout_seconds: 1800
