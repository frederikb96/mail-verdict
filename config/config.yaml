# MailVerdict Infrastructure Configuration
#
# This file contains ONLY infrastructure settings (file-based, requires a
# restart to take effect). Application settings (AI, spam, rules, retry) --
# including provider API keys -- live in the database and are managed via
# the Settings API.
#
# Override: config-custom/config.override.yaml (sparse, only changed values)
# or MAIL_VERDICT_<SECTION>_<KEY> environment variables.

server:
  host: 0.0.0.0
  port: 8080
  # A plain background socket the liveness probe hits instead of the main
  # port -- it answers from its own thread, so it stays responsive even
  # when a handler blocks the asyncio event loop the rest of the app runs
  # on. Change the chart's matching container port alongside this.
  liveness_port: 8081
  # How long the readiness probe waits for the database before deciding the
  # answer is "busy" rather than "broken". A pod that is merely loaded stays
  # in the Service; one whose database is genuinely unreachable leaves it.
  readiness_timeout_seconds: 0.5
  log_level: INFO
  cors_origins: []            # same-origin serving by default; empty disables CORS

# Who is calling. Every request under /api and /mcp carries an OIDC JWT in
# `Authorization: Bearer ...` -- the ID token an authenticating proxy forwards
# for a browser, or an access token a native app or an agent sends itself --
# and the app validates it against the issuer's published keys. Only
# /api/health and /api/auth/config answer without one. There is no "auth off":
# the app refuses to start without an issuer, a key set, an audience and an
# owner subject.
auth:
  # The issuer URL, compared exactly against the token's `iss` claim.
  issuer: ""
  # Where the issuer publishes its signing keys (JWKS).
  jwks_url: ""
  # A token is accepted when its `aud` names at least one of these: typically
  # the web client id the proxy signs in with, the project or API audience
  # machine tokens carry, and the native app's client id. Comma-separated in
  # MAIL_VERDICT_AUTH_AUDIENCES.
  audiences: []
  # Subjects (`sub` claims) that are the instance owner: the first user, who
  # owns every account that existed before users did and is admin whatever
  # the users table says. Every subject listed here is the SAME user -- list
  # one person's own identities (their login, their machine tokens), never
  # two people. Comma-separated in MAIL_VERDICT_AUTH_OWNER_SUBJECTS.
  owner_subjects: []
  # Whether a valid token whose subject is unknown creates a new ordinary user
  # on first request. With false, users exist only once an admin adds them
  # (POST /api/admin/users) and anyone else gets 403 unknown_user -- the
  # issuer's own access control is then not the only gate.
  auto_provision: true
  # Clock skew tolerated on exp/nbf/iat.
  leeway_seconds: 60
  # How long a fetched key set is used before it is fetched again. A token
  # signed by a key not in the set triggers an earlier refetch.
  jwks_cache_seconds: 3600
  # How long one request to the issuer may take.
  request_timeout_seconds: 10
  # How long a validated token is remembered (never past its own expiry), so
  # a busy client is not re-verified on every request.
  token_cache_seconds: 60
  # How long who-a-subject-is is remembered. A user disabled or made admin
  # takes effect within this, or at once on the replica that made the change.
  principal_cache_seconds: 30
  # Served unauthenticated by GET /api/auth/config so a native app can start
  # a sign-in before it holds a token. An empty client id means this server
  # offers no native sign-in.
  native_client_id: ""
  native_scopes: "openid profile email offline_access"
  native_redirect_uri: "mailverdict://auth/callback"

security:
  # AES-256-GCM key (64 hex characters / 32 bytes) encrypting provider API
  # keys stored via the Settings API. Empty disables storing a key that
  # way -- ANTHROPIC_API_KEY / OPENAI_API_KEY environment variables still
  # work as a fallback. Generate: python -c "import os; print(os.urandom(32).hex())"
  encryption_key: "${ENCRYPTION_KEY}"

# Limits on an outgoing message's attachments. Both are enforced while the
# upload is being read, because the cost being bounded is memory: every
# attachment is held whole to be handed to PostIMAP.
outbox:
  # Largest single attachment. Most providers reject well below this.
  max_attachment_bytes: 26214400
  # Largest total across one message, and the cap that actually protects the
  # process -- without it, many acceptable attachments still exhaust memory.
  max_attachments_total_bytes: 52428800
  # How many attachments one message may carry.
  max_attachments: 20
  # How long a message may wait on its way out before it is raised as an
  # alert rather than left waiting silently: an outbox row PostIMAP has not
  # finished with, or a send whose undo window passed without it moving on.
  # A healthy send takes seconds; this catches the one that stopped.
  stalled_alert_after_seconds: 600

# An AI provider whose circuit breaker has stayed suspended (no key, a
# rejected key, spent credit or allowance) this long is raised as an alert
# rather than left waiting silently; it clears once the provider answers.
providers:
  suspended_alert_after_seconds: 1800

# Token usage of every paid model call (usage/): one row per provider
# response, pushed to an Elasticsearch data stream once both the URL below is
# set and the elastic_usage API key is stored through the settings API.
# Without either, rows are still recorded and pruned, and nothing is sent.
usage_export:
  elasticsearch_url: ""
  data_stream: "logs-llm.usage-default"
  # How often the export runs, per process (one replica at a time).
  interval_seconds: 60
  # Documents per _bulk request.
  batch_size: 500
  request_timeout_seconds: 30
  # Usage rows older than this are deleted, sent or not.
  retention_days: 90

mail_actions:
  # How long the idempotency key of a message action or bulk action is
  # remembered. A client retrying within this window is answered with the
  # first response instead of acting again; one retrying later is applied
  # afresh. A request carrying expected_folder_id(s) is still safe then: a
  # message no longer where the client saw it is left alone.
  submission_retention_hours: 168

# Native (iPhone) push. The app registers its device with a push relay, and
# this server sends each notification through that relay sealed with a key
# only the phone holds: the relay sees the device token, the caller's
# address and an encrypted blob, never a subject, a sender or an account.
# Needs security.encryption_key, which protects the stored relay tickets.
push:
  # Relays a native app may register this server against. An empty list
  # disables native push and stops every send to a relay.
  apns_relay_urls: ["https://mailverdict-push.frederikberg.net"]
  # Minimum gap between two silent "something was read" pushes to phones;
  # a change inside the gap is sent once at its end.
  read_sync_min_interval_seconds: 600
  # How long one request to a relay may take before it counts as failed.
  relay_timeout_seconds: 10

# Rule-triggered webhooks (webhooks/worker.py): a rule's "webhook" action
# queues one delivery per mail, and one worker sends them in order.
webhooks:
  # How long one request may take end to end. Some receivers do real work
  # inside the request (parsing an attachment, say), so this is generous.
  request_timeout_seconds: 60
  # Attempts per delivery before it is marked failed and raised as an alert.
  # Only a transient outcome (5xx, 408, 429, network error, timeout) is
  # retried; any other response ends the delivery at once.
  max_attempts: 6
  # Retry delay: full-jitter exponential from the base, capped.
  base_delay_seconds: 30
  max_delay_seconds: 1800
  # Largest raw message sent. A larger one fails at once instead of being
  # rejected by the receiver after a long upload.
  max_body_bytes: 26214400
  # Fallback poll when the queue's wake-up notification is missed.
  poll_interval_seconds: 2
  # How long a claimed delivery may sit unrenewed before it is reclaimed.
  # The worker renews it while a request is in flight, so this only
  # matters after a crash.
  lease_seconds: 120

# Reading attachments for the orders pipeline (orders/extract/): PDF text,
# barcodes, scanned pages through Tesseract, passes, calendars and invoices.
# Every document is read in a child process (orders/extract/pool.py), so a
# hostile file can hang or crash that process but never the API.
extraction:
  # Largest document read; a bigger one is recorded as failed unread.
  max_document_bytes: 26214400
  # Wall-clock budget for one document, covering a slow scan and a hung
  # child alike. Past it the child is killed and the document counts as failed.
  timeout_seconds: 90
  # Pages of one PDF read at all (text layer or OCR).
  max_pdf_pages: 60
  # Leading pages scanned for barcodes. A ticket's code sits on its first
  # pages; later pages are terms and conditions.
  barcode_pages: 4
  # Pages OCR'd when a PDF has pages without a text layer.
  ocr_pages: 5
  # Tesseract languages, `+`-joined. All of them must be installed.
  ocr_languages: "deu+eng+nld"
  # One Tesseract call (a page, or an image). Tesseract runs as a
  # subprocess with its own limit inside the child.
  ocr_timeout_seconds: 60
  # Largest image, in pixels, that is decoded; a larger one is refused.
  max_image_pixels: 50000000
  # Hard ceiling on the text kept from one document, so a huge file cannot
  # fill the child's reply. Prompt budgets (orders/extract/truncate.py) sit
  # far below it.
  max_text_chars: 400000
  # Long side, in pixels, of the copy of an OCR'd image the orders `read`
  # model may get (when it reads, is the setting orders.read_below_confidence).
  vision_max_side: 1600

# Files a person adds to the orders register by hand (POST /api/orders/files).
# Every file is held whole in memory while it is read, so the per-file and
# per-entry totals bound the process as much as the stored size.
order_files:
  # Largest single file; enforced while the upload is read.
  max_file_bytes: 26214400
  # Files one entry may hold. Checked when a file is added to a named entry
  # (as is the total below); a file the model places is not counted.
  max_files_per_order: 20
  # Total bytes of the files of one entry.
  max_total_bytes_per_order: 52428800
  # A file the register failed to place is deleted this many days after it
  # was added. Until then it is listed in the entry it was added to, where it
  # can be downloaded or deleted; one added with no entry shows only at
  # GET /api/orders/files/{file_id}.
  failed_retention_days: 7

database:
  url: "${MAIL_VERDICT_DATABASE_URL}"
  pool_size: 10
  max_overflow: 5
  # Connections held back from the combined running concurrency of every
  # queue (queue/manager.py) so an HTTP handler sharing this pool always
  # finds one free. A queue's own concurrency ceiling is
  # (pool_size + max_overflow - reserved_for_requests) minus whatever
  # every other running queue has already claimed.
  reserved_for_requests: 3

search:
  # Semantic search finds its pool of nearest messages one of two ways
  # (embeddings/search.py). Inside a scope (account, folders, time window)
  # of at most this many messages it ranks exactly those messages' vectors:
  # complete by construction, and it only reads the vectors of the messages
  # inside the scope. Above it, it asks the HNSW index for the nearest
  # vectors with the time window and account applied inside the index scan,
  # because ranking a wide scope exactly reads every vector in it. The
  # point where the exact path's cost, linear in the scope's size, passes the
  # index path's: on a 25,000-message mailbox with the vectors in memory the
  # exact path measured about 10 ms per 1,000 messages in scope plus a few
  # milliseconds (40 ms at 300 messages, 130 ms at 7,000, 270 ms at 21,000)
  # and the index path 60 to 320 ms, so at this size the two meet only above
  # the threshold. Exact cost keeps growing with the mailbox; the index path
  # does not, which is why the threshold is a fixed size and not a share of
  # the mailbox.
  exact_scan_max_rows: 5000
  # How many distinct search queries keep their embedding vector in memory
  # (least recently used first out). The provider round trip is nearly all of
  # a semantic search's latency, and the same query is re-submitted whenever
  # the time window changes or the page is revisited. One vector is about
  # 12 KB at 1536 dimensions.
  query_cache_size: 256
  # How long a search waits for the provider to embed its query before the
  # search answers 503 semantic_unavailable. Stored messages are embedded by
  # the queue worker with its own, longer timeouts.
  query_timeout_seconds: 10
  # A rate-limited query embedding is retried once after this many seconds;
  # a second rate limit answers 503 semantic_unavailable. A search must not
  # wait out the longer backoff the queue worker uses.
  query_rate_limit_retry_seconds: 1
  # Whether embeddings of models that are neither the active nor the target
  # model are deleted once the target has taken over. They are never read
  # by search or by neighbour hints, and cost memory the active vectors need
  # (the superseded model's vectors are about half the table and its index).
  # Switching back to a model whose rows were deleted means embedding every
  # message again.
  prune_superseded_models: true

# The glacier: a per-account place a message can be moved to where it
# leaves the mail server for good and lives on only in this database
# (glacier/). Every write it makes to the mail server -- an EXPUNGE, an
# APPEND on restore -- goes through the same small, paced steps whether
# triggered by hand or by the automatic sweep below.
glacier:
  # The global kill switch for the automatic sweep. Manual glaciering
  # and restore are unaffected -- this only stops the periodic pass that
  # moves an account's own archive in on its own schedule.
  sweep_enabled: true
  # How often the sweep ticks, per process (one replica actually runs it
  # at a time, via an advisory lock).
  interval_seconds: 60
  # How many messages one tick may newly glacier, per account. Paced
  # deliberately low: each glaciered message becomes one queued IMAP
  # EXPUNGE in PostIMAP's outbound queue, ahead of every flag change and
  # send that account makes meanwhile -- a flood here would stall the
  # interactive app. At this rate a mailbox with thousands of archived
  # messages finishes in a few hours, not in one tick.
  batch_size: 25
  # The sweep's circuit breaker: an account with this many messages
  # already sitting unconfirmed in the "removing" state is skipped
  # entirely until some of them resolve, rather than piling on more.
  max_unconfirmed: 500
  # How long a message must have sat in "removing" with no matching
  # sync_notifications failure before its expunge counts as confirmed --
  # the contract offers no positive "this landed" signal, so the end is
  # detected by age instead of by enumerating every way it can fail.
  confirm_grace_seconds: 600
  # The largest manual move-into-the-glacier a single request may make.
  # The copy itself is cheap, but each message becomes one queued IMAP
  # EXPUNGE, so a large manual selection is refused in favour of turning
  # on the automatic sweep instead.
  max_manual_batch: 200
  # How long a restore (the APPEND syncing back as a live message) may
  # take before it is treated as failed, with an alert raised and the
  # glacier copy left intact for a retry.
  restore_timeout_seconds: 1800
