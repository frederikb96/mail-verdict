# MailVerdict Infrastructure Configuration
#
# This file contains ONLY infrastructure settings (file-based, requires a
# restart to take effect). Application settings (AI, spam, rules, retry) --
# including provider API keys -- live in the database and are managed via
# the Settings API.
#
# Override: config-custom/config.override.yaml (sparse, only changed values)
# or MAIL_VERDICT_<SECTION>_<KEY> environment variables.

server:
  host: 0.0.0.0
  port: 8080
  # A plain background socket the liveness probe hits instead of the main
  # port -- it answers from its own thread, so it stays responsive even
  # when a handler blocks the asyncio event loop the rest of the app runs
  # on. Change the chart's matching container port alongside this.
  liveness_port: 8081
  # How long the readiness probe waits for the database before deciding the
  # answer is "busy" rather than "broken". A pod that is merely loaded stays
  # in the Service; one whose database is genuinely unreachable leaves it.
  readiness_timeout_seconds: 0.5
  log_level: INFO
  cors_origins: []            # same-origin serving by default; empty disables CORS

security:
  # AES-256-GCM key (64 hex characters / 32 bytes) encrypting provider API
  # keys stored via the Settings API. Empty disables storing a key that
  # way -- ANTHROPIC_API_KEY / OPENAI_API_KEY environment variables still
  # work as a fallback. Generate: python -c "import os; print(os.urandom(32).hex())"
  encryption_key: "${ENCRYPTION_KEY}"

# Limits on an outgoing message's attachments. Both are enforced while the
# upload is being read, because the cost being bounded is memory: every
# attachment is held whole to be handed to PostIMAP.
outbox:
  # Largest single attachment. Most providers reject well below this.
  max_attachment_bytes: 26214400
  # Largest total across one message, and the cap that actually protects the
  # process -- without it, many acceptable attachments still exhaust memory.
  max_attachments_total_bytes: 52428800
  # How many attachments one message may carry.
  max_attachments: 20

database:
  url: "${MAIL_VERDICT_DATABASE_URL}"
  pool_size: 10
  max_overflow: 5
  # Connections held back from the combined running concurrency of every
  # queue (queue/manager.py) so an HTTP handler sharing this pool always
  # finds one free. A queue's own concurrency ceiling is
  # (pool_size + max_overflow - reserved_for_requests) minus whatever
  # every other running queue has already claimed.
  reserved_for_requests: 3
