{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mail-verdict.fullname" . }}
  labels:
    {{- include "mail-verdict.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKeys.databaseUrl }}: {{ .Values.secret.databaseUrl | quote }}
  {{- if .Values.secret.apiKey }}
  {{ .Values.existingSecretKeys.apiKey }}: {{ .Values.secret.apiKey | quote }}
  {{- end }}
  {{- if .Values.secret.anthropicApiKey }}
  {{ .Values.existingSecretKeys.anthropicApiKey }}: {{ .Values.secret.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
