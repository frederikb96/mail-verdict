apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mail-verdict.fullname" . }}
  labels:
    {{- include "mail-verdict.labels" . | nindent 4 }}
spec:
  # values.schema.json pins replicaCount to the literal value 1 -- see the
  # comment on it in values.yaml for why.
  replicas: {{ .Values.replicaCount }}
  # Fixed -- a rolling update would briefly run old and new pods with
  # disjoint in-memory EventRings and duplicate LISTEN/NOTIFY consumers,
  # which this single-instance workload cannot tolerate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mail-verdict.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mail-verdict.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mail-verdict.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mail-verdict
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "mail-verdict.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # Derived from `config.server.port` when set, since that is the
            # port the application binds; otherwise it follows `service.port`.
            - name: http
              containerPort: {{ include "mail-verdict.appPort" . }}
              protocol: TCP
          env:
            - name: MAIL_VERDICT_CONFIG_OVERRIDE_PATH
              value: {{ .Values.configOverridePath | quote }}
            # Names match the `${VAR}` placeholders the image's bundled
            # config/config.yaml already resolves `database.url` and
            # `security.encryption_key` from -- no config: override needed
            # for these.
            - name: MAIL_VERDICT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mail-verdict.secretName" . }}
                  key: {{ .Values.existingSecretKeys.databaseUrl }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mail-verdict.secretName" . }}
                  key: {{ .Values.existingSecretKeys.encryptionKey }}
                  optional: true
            # Provider keys are read as an env-var fallback -- see the
            # chart README's secrets section. Prefer setting them through
            # the running application's Settings API instead.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mail-verdict.secretName" . }}
                  key: {{ .Values.existingSecretKeys.anthropicApiKey }}
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mail-verdict.secretName" . }}
                  key: {{ .Values.existingSecretKeys.openaiApiKey }}
                  optional: true
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-override
              mountPath: {{ .Values.configOverridePath }}
              subPath: config.override.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-override
          configMap:
            name: {{ include "mail-verdict.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
