name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed paths
    runs-on: arc-runner-mail-verdict
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'alembic/**'
              - 'alembic.ini'
              - 'config/**'
              - '.github/workflows/ci.yaml'
            ui:
              - 'ui/**'
              - '.github/workflows/ci.yaml'
            image:
              - 'docker/**'
              - 'src/**'
              - 'ui/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yaml'
            chart:
              - 'charts/**'
              - '.github/workflows/ci.yaml'

  lint:
    name: Lint + type check
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/

  unit:
    name: Unit tests
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

  pg:
    name: Postgres + PostIMAP integration tests
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: pg-layer tests
        run: pytest tests/pg/ -v --tb=short

  e2e:
    name: End-to-end tests
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: e2e tests
        run: pytest tests/e2e/ -v --tb=short
  ui:
    name: UI type check + build
    needs: detect
    if: ${{ needs.detect.outputs.ui == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: ui
        run: npm run build

  image:
    name: Container image builds
    needs: detect
    if: ${{ needs.detect.outputs.image == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built but never pushed: this proves the release will not discover a
      # broken Dockerfile after the tag has already been created.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    needs: detect
    if: ${{ needs.detect.outputs.chart == 'true' }}
    runs-on: arc-runner-mail-verdict
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint charts/mail-verdict

      - name: Render default and example values
        run: |
          set -o pipefail
          helm template mail-verdict charts/mail-verdict > /dev/null
          helm template mail-verdict charts/mail-verdict \
            -f charts/mail-verdict/examples/values-production.yaml > /dev/null

      - name: Reject an unsupported replica count
        run: |
          if helm template mail-verdict charts/mail-verdict --set replicaCount=3 > /dev/null 2>&1; then
            echo "values.schema.json accepted replicaCount=3; the guard is not working"
            exit 1
          fi

  ci-ok:
    name: CI ok
    needs: [detect, lint, unit, pg, e2e, ui, image, chart]
    if: ${{ !cancelled() }}
    runs-on: arc-runner-mail-verdict
    steps:
      - name: Fail if any required job failed
        run: |
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.pg.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.ui.result }}" \
            "${{ needs.image.result }}" \
            "${{ needs.chart.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
