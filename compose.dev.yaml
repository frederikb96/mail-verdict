name: mv-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    container_name: mv-app-dev
    ports:
      - "18080:8080"
    volumes:
      - ./src:/app/src:Z
      - ./config:/app/config:ro,Z
      - ./config-custom:/app/config-custom:ro,Z
      - ./alembic:/app/alembic:ro,Z
      - ./alembic.ini:/app/alembic.ini:ro,Z
      - ./ui/build:/app/ui/build:ro,Z
    environment:
      MAIL_VERDICT_DATABASE_URL: "postgresql+asyncpg://devuser:${POSTGRES_PASSWORD}@postgres:5432/mail_verdict_dev"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      postimap:
        condition: service_healthy
      dovecot:
        condition: service_started
      mailpit:
        condition: service_started
    # --reload pre-binds the listening socket once in the reloader
    # process and hands it to each worker generation, so it stays open
    # and accepting connections across a restart -- if the worker that
    # reload just spawned dies at startup, a TCP connect against 8080
    # still succeeds (nothing readable serves it, curl's own request
    # never gets a response) and stays open until the next file change
    # respawns a worker. Without --max-time, curl -sf would hang on
    # exactly that dangling connection rather than reporting failure --
    # a passing check would then be proving the reloader's socket is
    # still bound, not that the application answered. retries/interval
    # are tighter than the prod image's, since a worker in this state
    # can otherwise sit reported "healthy" for minutes before enough
    # consecutive failures flip the status.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "3", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: "no"

  postimap:
    image: ghcr.io/frederikb96/postimap:1.6.0
    container_name: mv-postimap-dev
    environment:
      POSTIMAP_DATABASE_HOST: postgres
      POSTIMAP_DATABASE_PORT: "5432"
      POSTIMAP_DATABASE_NAME: mail_verdict_dev
      POSTIMAP_DATABASE_USER: devuser
      # The dev mail server presents a self-signed certificate. Production
      # must never set this -- it is why compose.yaml has no equivalent.
      POSTIMAP_IMAP_TLS_REJECT_UNAUTHORIZED: "false"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  postgres:
    image: docker.io/pgvector/pgvector:pg18
    container_name: mv-postgres-dev
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: mail_verdict_dev
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d mail_verdict_dev"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - /tmp/mv-dev-pgdata:/var/lib/postgresql:Z
    restart: "no"

  # Throwaway mail world for local dev: any username authenticates with
  # MAIL_PASSWORD, its mailbox is created on first login -- there is no
  # account provisioning step. LMTP speaks implicit TLS, matching what
  # scripts/seed_dev.py expects on its default port.
  dovecot:
    image: docker.io/dovecot/dovecot:2.4.5
    container_name: mv-dovecot-dev
    ports:
      - "14143:31143"  # IMAP, for poking at the mailbox directly if needed
      - "24024:31024"  # LMTP (implicit TLS) -- scripts/seed_dev.py's default
    environment:
      USER_PASSWORD: "${MAIL_PASSWORD}"
    restart: "no"

  # SMTP sink for the outbox: accepts any AUTH so an account's
  # smtp_user/smtp_password round-trips through a real exchange, and its
  # own interface shows every message the application actually sent.
  mailpit:
    image: docker.io/axllent/mailpit:v1.28.3
    container_name: mv-mailpit-dev
    ports:
      - "18025:8025"  # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: "no"

  # Throwaway CalDAV/CardDAV server for local dev, the same image
  # PostIMAP's own test suite runs. Its default auth.type = none accepts
  # any Basic auth and auto-creates the principal (and its collections)
  # on first request -- there is no account-provisioning step here
  # either. scripts/seed_dev.py speaks CalDAV/CardDAV to it directly to
  # seed a calendar and an address book before any dav_account exists,
  # the same role LMTP delivery plays for mail.
  radicale:
    image: docker.io/tomsquest/docker-radicale:3.7.6.0
    container_name: mv-radicale-dev
    ports:
      - "15232:5232"
    restart: "no"
